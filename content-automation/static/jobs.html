<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>All jobs</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; font-size: 14px; }
    a { color: #1a1a1a; }
    .btn { display: inline-block; margin-top: 20px; padding: 10px 16px; background: #1a1a1a; color: white; border-radius: 6px; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <h1>All jobs</h1>
  <a class="btn" href="/">+ New job</a>
  <table>
    <tr><th>Business</th><th>Package</th><th>Status</th><th></th></tr>
    {% for job in jobs %}
    <tr>
      <td>{{ job.business_name }}</td>
      <td>{{ job.package }}</td>
      <td>{{ job.status }}</td>
      <td><a href="/job/{{ job.job_id }}">view</a></td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
