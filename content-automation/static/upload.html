<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Content Job</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
    h1 { font-size: 22px; }
    label { display: block; margin-top: 18px; font-size: 14px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 28px; padding: 12px 20px; background: #1a1a1a; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
    a.nav { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <a class="nav" href="/jobs">View past jobs &rarr;</a>
  <h1>New client content job</h1>
  <form action="/submit" method="post" enctype="multipart/form-data">
    <label>Business name</label>
    <input name="business_name" required placeholder="e.g. Meera Jewellers">

    <label>Business type</label>
    <input name="business_type" required placeholder="e.g. jewellery shop">

    <label>Product name (optional)</label>
    <input name="product_name" placeholder="e.g. gold bangles collection">

    <label>Package</label>
    <select name="package">
      {% for key, pkg in packages.items() %}
      <option value="{{ key }}">{{ pkg.label }} — {{ pkg.images }} images, {{ pkg.reels }} reels</option>
      {% endfor %}
    </select>

    <label>Product photos (5 recommended)</label>
    <input type="file" name="photos" accept="image/*" multiple required>
    <div class="hint">Upload the client's raw product photos.</div>

    <button type="submit">Start job</button>
  </form>
</body>
</html>
